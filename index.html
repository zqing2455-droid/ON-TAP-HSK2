<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn tập HSK2</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
:root{
  --paper:#FAF7F1; --card:#FFFFFF; --ink:#22282E; --ink-2:#4A5560;
  --muted:#8A8578; --line:#E4DED1; --line-2:#EFEAE0;
  --cin:#B33A2B; --cin-soft:#FBEDEA; --jade:#1F6F5C; --jade-soft:#EAF3EF;
  --gold:#C8963E; --gold-soft:#FDF4E4;
  --shadow:0 1px 2px rgba(34,40,46,.05),0 8px 22px -14px rgba(34,40,46,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#15191D; --card:#1C2126; --ink:#ECE7DC; --ink-2:#B6BDC4;
  --muted:#8E8878; --line:#2E353C; --line-2:#262C32;
  --cin:#E0725F; --cin-soft:#2A1E1B; --jade:#5FB79E; --jade-soft:#16241F;
  --gold:#DFAF5F; --gold-soft:#2A2114;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -16px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#15191D; --card:#1C2126; --ink:#ECE7DC; --ink-2:#B6BDC4;
  --muted:#8E8878; --line:#2E353C; --line-2:#262C32;
  --cin:#E0725F; --cin-soft:#2A1E1B; --jade:#5FB79E; --jade-soft:#16241F;
  --gold:#DFAF5F; --gold-soft:#2A2114;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:'Be Vietnam Pro',system-ui,sans-serif; font-size:15px; line-height:1.6}
.zh{font-family:'Noto Serif SC','KaiTi',serif}
.wrap{max-width:820px; margin:0 auto; padding:0 16px 64px}
header{padding:40px 0 10px}
.eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--cin)}
h1{font-size:clamp(28px,6vw,42px); line-height:1.1; font-weight:800; margin:.3em 0 .15em}
h1 .zh{font-weight:900}
.sub{color:var(--ink-2); max-width:60ch; margin:.4em 0 0}
.new-tag{display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:99px;
  background:var(--cin); color:#fff; letter-spacing:.06em; margin-left:6px; vertical-align:middle}

h2.sec{font-size:13px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); margin:34px 0 10px; padding-bottom:8px; border-bottom:2px solid var(--ink)}
.list{display:grid; gap:12px}
a.les{display:flex; gap:14px; align-items:center; text-decoration:none; color:inherit;
  background:var(--card); border:1px solid var(--line); border-left:3px solid var(--ink);
  border-radius:10px; padding:14px 16px; box-shadow:var(--shadow); transition:transform .12s,border-color .15s}
a.les:hover{transform:translateY(-1px); border-color:var(--ink-2)}
a.les.done{border-left-color:var(--jade)}
.seal{flex:none; width:48px; height:48px; border-radius:7px; background:var(--cin); color:#fff;
  display:grid; place-items:center; font-family:'Noto Serif SC',serif; font-size:22px; font-weight:600;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.55), inset 0 0 0 3px var(--cin)}
a.les.done .seal{background:var(--jade); box-shadow:inset 0 0 0 2px rgba(255,255,255,.55), inset 0 0 0 3px var(--jade)}
.body{flex:1; min-width:0}
.meta{font-size:12px; color:var(--muted); font-weight:600}
.ttl{font-size:17px; font-weight:700; line-height:1.35; margin:1px 0 4px}
.tags{display:flex; flex-wrap:wrap; gap:5px}
.tags span{font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:99px;
  background:var(--line-2); color:var(--ink-2)}
.prog{flex:none; text-align:right; font-size:12px; color:var(--muted); width:72px}
.bar{height:5px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:4px}
.bar i{display:block; height:100%; background:var(--jade)}
.soon{opacity:.55; pointer-events:none; border-left-color:var(--line)}
.soon .seal{background:var(--line); color:var(--muted); box-shadow:none}
footer{margin-top:44px; padding-top:16px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted)}
@media (max-width:480px){ .prog{width:52px} .seal{width:40px;height:40px;font-size:18px} }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">《新 HSK 教程 2》</div>
  <h1>Ôn tập <span class="zh">HSK 2</span></h1>
  <p class="sub">Mỗi tuần có thêm một bài ôn mới. Chọn bài để làm — tiến độ của em được lưu trên máy này,
  lần sau mở lại vẫn thấy mình đã làm tới đâu.</p>
</header>

<h2 class="sec">Các bài ôn</h2>
<div class="list" id="list"></div>

<footer>Bài mới nhất nằm trên cùng.</footer>
</div>

<script>
/* ═════════ TỰ ĐỘNG TÌM BÀI ═════════
   Không cần sửa gì ở đây. Trang tự dò bai/bai-01.html, bai-02.html, …
   cho tới khi không thấy bài tiếp theo, rồi đọc tên bài và số câu từ chính file bài. */
const NUM='零一二三四五六七八九十';
const cn=n=> n<=10?NUM[n] : n<20?'十'+(n%10?NUM[n%10]:'') : NUM[Math.floor(n/10)]+'十'+(n%10?NUM[n%10]:'');
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function done(key){ try{ return (JSON.parse(localStorage.getItem(key)||'[]')).filter(v=>typeof v==='number').length; }catch(e){ return 0; } }

async function readLesson(n){
  const file='bai/bai-'+pad(n)+'.html';
  let r; try{ r=await fetch(file,{cache:'no-cache'}); }catch(e){ return null; }
  if(!r.ok) return null;
  const html=await r.text();
  const doc=new DOMParser().parseFromString(html,'text/html');
  const key=(html.match(/const\s+KEY\s*=\s*['"]([^'"]+)['"]/)||[])[1]||file;
  const total=+((html.match(/const\s+TOTAL\s*=\s*(\d+)/)||[])[1]||0);
  const zh=doc.querySelector('h1 .zh')?.textContent.trim() || doc.title;
  const tags=[...doc.querySelectorAll('.fact')].map(x=>x.textContent.trim()).slice(0,4);
  const mod=r.headers.get('last-modified');
  return {so:n, file, key, total, zh, tags, mod: mod?new Date(mod).getTime():0};
}

(async()=>{
  const list=document.getElementById('list');
  list.innerHTML='<p class="meta">Đang tải danh sách bài…</p>';
  const found=[];
  for(let n=1;n<=200;n++){ const l=await readLesson(n); if(!l) break; found.push(l); }
  list.innerHTML='';
  if(!found.length){ list.innerHTML='<p class="meta">Chưa có bài nào. Hãy đặt file bai-01.html vào thư mục bai/.</p>'; return; }
  const newest=Math.max(...found.map(l=>l.so));
  found.sort((a,b)=>b.so-a.so).forEach(l=>{
    const d=l.total?Math.min(done(l.key),l.total):0, pct=l.total?Math.round(d/l.total*100):0;
    const isNew = l.so===newest && (!l.mod || Date.now()-l.mod < 7*864e5);
    const a=document.createElement('a');
    a.className='les'+(pct===100?' done':''); a.href=l.file;
    a.innerHTML=
      '<div class="seal">'+cn(l.so)+'</div>'+
      '<div class="body">'+
        '<div class="meta">Bài '+l.so+(l.total?' · '+l.total+' câu':'')+(isNew?'<span class="new-tag">MỚI</span>':'')+'</div>'+
        '<div class="ttl"><span class="zh">'+esc(l.zh)+'</span></div>'+
        '<div class="tags">'+l.tags.map(t=>'<span>'+esc(t)+'</span>').join('')+'</div>'+
      '</div>'+
      '<div class="prog">'+(pct===100?'✓ Xong':d+'/'+l.total)+'<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
    list.append(a);
  });
})();
</script>
</body>
</html>
