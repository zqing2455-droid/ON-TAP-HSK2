<style>
:root{
  --m-nen:#FAF7F1;--m-the:#FFFFFF;--m-the-2:#F5F1EA;--m-la:#3F5B4C;--m-la-dam:#2C4236;--m-la-nhat:#E8EEE6;--m-la-vua:#9DB4A2;
  --m-hong:#D9958A;--m-hong-nhat:#F9E7E2;--m-dao:#F8EBDA;--m-tim:#ECE8F6;--m-vang:#DDA640;--m-vang-nhat:#FBF1DC;
  --m-chu:#2F3A33;--m-chu-phu:#6F7A72;--m-vien:#ECE5D8;
  --m-bong:0 1px 0 rgba(44,66,54,.04),0 12px 28px -16px rgba(44,66,54,.22);--m-bo:22px;--m-bo-nho:14px;
  --m-serif:'Fraunces','Noto Serif SC',Georgia,serif;
  --m-sans:'Nunito','Noto Sans SC',system-ui,-apple-system,sans-serif;
  --m-han:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;font:500 15px/1.6 var(--m-sans);color:var(--m-chu);background:var(--m-nen)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
.backlink{padding-top:22px;font-size:13px;font-weight:700;margin:0}
a{color:var(--m-la)}
.backlink a{text-decoration:none}
header{padding:14px 0 12px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--m-la)}
h1{font:700 clamp(26px,5.4vw,38px)/1.2 var(--m-serif);color:var(--m-la-dam);margin:.3em 0 .15em}
h1 .zh{font-weight:900}
.sub{max-width:62ch;margin:.4em 0 0;color:var(--m-chu-phu)}
.zh{font-family:var(--m-han)}
footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--m-vien);font-size:12.5px;color:var(--m-chu-phu)}

.card{background:var(--m-the);border:1.5px solid var(--m-vien);border-radius:var(--m-bo);box-shadow:var(--m-bong);padding:18px}
.btn{font:800 15px/1.3 var(--m-sans);padding:11px 20px;border-radius:999px;border:1.5px solid var(--m-la);background:var(--m-la);
  color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{background:var(--m-la-dam)}
.btn.ghost{background:#fff;color:var(--m-la)}
.btn.ghost:hover{background:var(--m-la-nhat)}
.btn:focus-visible,.fish:focus-visible,summary:focus-visible{outline:3px solid var(--m-vang);outline-offset:3px}
.g-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.g-pill{font-size:12.5px;font-weight:800;background:var(--m-la-nhat);color:var(--m-la);border-radius:999px;padding:4px 12px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--m-vien)}
.dots i.ok{background:var(--m-la)}
.dots i.miss{background:var(--m-hong)}
.dots i.cur{background:var(--m-vang);box-shadow:0 0 0 3px var(--m-vang-nhat)}
.g-lead{color:var(--m-chu-phu);font-size:14.5px;margin:0 0 12px}
.g-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.g-row .btn{flex:1 1 150px}

/* ba mẹo */
.meo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 4px}
.meo div{border-radius:var(--m-bo-nho);padding:12px 12px 10px;text-align:center}
.meo .m1{background:var(--m-dao)}.meo .m2{background:var(--m-tim)}.meo .m3{background:var(--m-la-nhat)}
.meo b.zh{display:block;font-size:44px;line-height:1.15;color:var(--m-la-dam);font-weight:900}
.meo .ct{display:block;font-weight:800;font-size:13.5px;color:var(--m-la-dam);margin-top:4px;line-height:1.35}
.meo .vd{display:block;font-size:19px;margin-top:4px;line-height:1.4}
.meo .vd u{text-decoration:none;color:#B8685C;font-weight:900}
.meo .nghia{display:block;font-size:12.5px;color:var(--m-chu-phu);line-height:1.35}
details.xem{margin-top:14px}
details.xem summary{cursor:pointer;font-weight:800;font-size:13.5px;color:var(--m-la);padding:6px 0;list-style-position:inside}
details.xem .meo{margin-top:8px}

/* câu hỏi */
.qbox{border-radius:var(--m-bo-nho);background:var(--m-la-nhat);padding:12px 14px;text-align:center;margin-bottom:10px;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.qtext{font-size:32px;line-height:1.55;color:var(--m-la-dam);font-weight:600}
.qpy{font-size:15px;color:var(--m-la);font-weight:700}
.qpy u{text-decoration:none;border-bottom:2px solid var(--m-vang)}
.qvn{font-size:14.5px;color:#55615A}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.qbox .btn{padding:7px 16px;font-size:13.5px}
body.an-py .qpy{display:none}
.blank{display:inline-block;min-width:1.5em;border-bottom:4px solid var(--m-vang);color:var(--m-vang);margin:0 4px;line-height:1.15;font-weight:900}
.blank.fill{color:#2E5A3C;border-color:#8DB596;background:#DDEBDD;border-radius:8px 8px 0 0}
.fb{margin-top:12px;padding:10px 14px;border:1.5px solid transparent;border-radius:var(--m-bo-nho);font-weight:700;font-size:14.5px;
  min-height:48px;text-align:center;line-height:1.5}
.fb:empty{visibility:hidden}
.fb.ok{background:#E4F0E5;border-color:#8DB596;color:#24492F}
.fb.bad{background:var(--m-hong-nhat);border-color:var(--m-hong);color:#7A3A30}
.fb .zh{font-size:1.15em}
#next{display:none;scroll-margin-bottom:16px}
.fb{scroll-margin-bottom:16px}
.g-pill{scroll-margin-top:14px}
#next.on{display:flex}

/* ao cá */
.pond{position:relative;height:370px;border-radius:var(--m-bo);overflow:hidden;border:1.5px solid var(--m-vien);--rise:-240px;
  background:linear-gradient(180deg,#F1F6EE 0,#F1F6EE 100px,#B5E0EE 100px,#74BCDD 100%);
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
.pond::before{content:"";position:absolute;left:0;right:0;top:100px;bottom:0;pointer-events:none;
  background:repeating-linear-gradient(176deg,rgba(255,255,255,.2) 0 2px,transparent 2px 26px)}
.deco{position:absolute;inset:0;pointer-events:none}
.weed{position:absolute;bottom:14px;width:auto;transform-origin:50% 100%}
.weed.far{opacity:.6;bottom:18px}
.weed.sway{animation:gsway 4.5s ease-in-out infinite alternate}
.sand{position:absolute;left:0;right:0;bottom:0;width:100%;height:34px}
.bub{position:absolute;bottom:22px;border-radius:50%;border:2px solid rgba(255,255,255,.9);
  background:rgba(255,255,255,.2);opacity:0;animation:gbub 7s linear infinite}
@keyframes gsway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes gbub{0%{transform:translateY(0);opacity:0}12%{opacity:1}85%{opacity:.9}100%{transform:translateY(var(--rise));opacity:0}}
.bank{position:absolute;left:-40px;top:78px;width:196px;height:60px;background:var(--m-la-vua);border-radius:50%}
.angler{position:absolute;left:8px;top:4px;width:96px;height:104px;z-index:1;transform-origin:0 0}
.angler svg{position:absolute;inset:0;width:100%;height:100%}
.angler-head{position:absolute;left:3px;top:0;width:86px;height:auto}
.pond.sm .angler{transform:scale(.76)}
.pond.sm .bank{width:150px;top:70px}
.pond-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.rod{stroke:#8B5A2B;stroke-width:4;stroke-linecap:round}
.fline{stroke:#55606E;stroke-width:1.5}
#bob{fill:var(--m-hong);stroke:#fff;stroke-width:1.5}
.fish{position:absolute;z-index:2;margin:0;padding:0;border:none;background:none;border-radius:40px;cursor:pointer;
  display:flex;align-items:center;flex-direction:row;font:inherit;-webkit-tap-highlight-color:transparent}
.fish.left{flex-direction:row-reverse}
.fimg{display:block;flex:none;filter:drop-shadow(0 3px 0 rgba(30,80,120,.2))}
.fish.left .fimg{transform:scaleX(-1)}
.fish:hover .fimg{filter:drop-shadow(0 3px 0 rgba(30,80,120,.2)) brightness(1.07)}
.flabel{position:relative;z-index:1;background:#fff;border:2px solid rgba(47,58,51,.3);border-radius:999px;
  padding:0 16px;margin-right:-8px;white-space:nowrap;line-height:1.35;color:var(--m-la-dam);font-weight:900;
  box-shadow:0 3px 0 rgba(30,80,120,.18)}
.fish.left .flabel{margin-right:0;margin-left:-8px}
.fish.no{opacity:.3;animation:gshake .4s;cursor:default}
.fish.got{z-index:4}
.fish.got .flabel{background:#E4F0E5;border-color:#8DB596}
@keyframes gshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* kết quả */
.score{text-align:center}
.score .big{font:700 54px/1.1 var(--m-serif);color:var(--m-la-dam)}
.score .big small{font-size:.5em;color:var(--m-chu-phu)}
.g-end{font:700 21px/1.3 var(--m-serif);color:var(--m-la-dam);margin:6px 0 4px}
.score .g-row{justify-content:center}
.xemlai{text-align:left;margin:16px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.xemlai li{background:var(--m-the-2);border:1.5px solid var(--m-vien);border-radius:var(--m-bo-nho);padding:9px 12px}
.xemlai .zh{font-size:21px;color:var(--m-la-dam);font-weight:600}
.xemlai .zh u{text-decoration:none;color:#B8685C;font-weight:900}
.xemlai small{display:block;color:var(--m-chu-phu);font-size:13px;line-height:1.45}
.xemlai-t{font-weight:800;font-size:13.5px;color:var(--m-la-dam);margin:18px 0 0;text-align:left}

@media(max-width:520px){
  .card{padding:14px}
  .pond{height:340px;--rise:-212px}
  .qtext{font-size:24px}
  .meo{grid-template-columns:1fr}
  .meo div{display:grid;grid-template-columns:64px 1fr;column-gap:10px;text-align:left;align-items:center}
  .meo b.zh{grid-row:1/4;font-size:40px;text-align:center}
  .meo .ct{margin-top:0}
}
@media(prefers-reduced-motion:reduce){
  .fish.no,.weed.sway,.bub{animation:none}
}
</style>
</head>

 try{localStorage.setItem(KEY_PY,anPy?"1":"0");}catch(e){}
 const b=$("qPyBtn");if(b){b.textContent=anPy?"Hiện phiên âm":"Ẩn phiên âm";b.setAttribute("aria-pressed",anPy?"true":"false");}
}
datPy(anPy);

/* trộn câu, tránh ba câu liền nhau cùng đáp án */
function tronCau(){
 for(let n=0;n<60;n++){
  const a=shuffle(CAU);
  if(!a.some((x,i)=>i>1&&x.a===a[i-1].a&&x.a===a[i-2].a))return a;
 }
 return shuffle(CAU);
}

/* ---------- đọc tiếng Trung: giọng của máy, không có thì nhờ Google ---------- */
let zhVoice=null;
function pickVoice(){
 const vs=window.speechSynthesis?speechSynthesis.getVoices():[];
 const zh=vs.filter(v=>/^zh/i.test(v.lang));
 zhVoice=zh.find(v=>/CN|Hans|Chinese \(China\)|普通话|Mandarin/i.test(v.lang+v.name))||zh[0]||null;
}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,rate){
 if(!text)return;
 if(window.speechSynthesis&&zhVoice){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.voice=zhVoice;u.lang=zhVoice.lang;u.rate=rate||0.8;
  speechSynthesis.speak(u);return;
 }
 try{new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q="+encodeURIComponent(text)).play().catch(()=>{});}catch(e){}
}
let AC=null;
function sfx(ok){
 try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime;
  (ok?[660,880]:[220]).forEach((f,k)=>{
   const o=AC.createOscillator(),v=AC.createGain();
   o.type=ok?"sine":"triangle";o.frequency.value=f;
   v.gain.setValueAtTime(.0001,t+k*.1);v.gain.exponentialRampToValueAtTime(.09,t+k*.1+.02);
   v.gain.exponentialRampToValueAtTime(.0001,t+k*.1+.22);
   o.connect(v);v.connect(AC.destination);o.start(t+k*.1);o.stop(t+k*.1+.25);});
 }catch(e){}
}

 '<div class="m1"><b class="zh">的</b><span class="ct">… 的 + danh từ</span><span class="vd zh">我<u>的</u>书</span><span class="nghia">sách của tôi</span></div>'+

/* ---------- màn mở đầu ---------- */
function intro(){
 G=null;
 let o={};try{o=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){}
 shell('<div class="card"><p class="g-lead"><b>Mẹo:</b> em nhìn từ đứng ngay <b>sau</b> chỗ trống. Sau là danh từ thì dùng 的, sau là động từ thì dùng 地. Còn 得 thì luôn đứng sau động từ, phía sau nó là lời nhận xét.</p>'+
  MEO+'<div class="g-row" id="ctrl"></div>'+
  (o.total?'<p class="g-lead" style="margin:12px 0 0;text-align:center">Kết quả tốt nhất của em: '+o.best+'/'+o.total+'</p>':'')+'</div>');
 $("ctrl").appendChild(btn("btn","Bắt đầu câu cá · 10 câu",start));
}

/* ---------- ván chơi ---------- */
const WATER=100;
function start(){
 window.scrollTo(0,0);
 const g=G={items:tronCau(),r:0,right:0,res:[],fish:[],busy:false,t:0};
 shell('<div class="card">'+
  '<div class="g-head"><span class="g-pill" id="gPill"></span><div class="dots" id="gDots"></div></div>'+
  '<div class="qbox"><div class="qtext zh" id="qText" lang="zh"></div><div class="qpy" id="qPy"></div><div class="qvn" id="qVn"></div>'+
   '<div class="qbtns"><button type="button" class="btn ghost" id="qSay">🔊 Nghe câu</button>'+
   '<button type="button" class="btn ghost" id="qPyBtn"></button></div></div>'+
  '<div class="pond" id="pond">'+POND_BG+'<div class="bank"></div>'+ANGLER+
   '<svg class="pond-svg" aria-hidden="true"><line class="rod" id="rod"/><line class="fline" id="fline"/><circle id="bob" r="5"/></svg></div>'+
  '<div class="fb" id="fb" role="status"></div>'+
  '<div class="g-row" id="next"></div>'+
  '<details class="xem"><summary>Xem lại mẹo phân biệt 的 · 得 · 地</summary>'+MEO+'</details></div>');
 $("qSay").onclick=()=>speak(full(g.cur));
 $("qPyBtn").onclick=()=>datPy(!anPy);datPy(anPy);
 round(g);
 requestAnimationFrame(ts=>loop(g,ts));
}
function dots(g){
 $("gDots").innerHTML=g.items.map((_,k)=>'<i class="'+(k<g.res.length?(g.res[k]?"ok":"miss"):k===g.r?"cur":"")+'"></i>').join("");
}
function round(g){
 const pond=$("pond");if(!pond)return;
 pond.querySelectorAll(".fish").forEach(e=>e.remove());
 g.busy=false;g.miss=0;
 const it=g.cur=g.items[g.r];
 $("gPill").textContent="Câu "+(g.r+1)+"/"+g.items.length;dots(g);
 if(g.r)thay($("gPill"));
 $("qText").innerHTML=esc(it.q).replace(TRONG,'<span class="blank" id="blank">?</span>');
 // gạch chân đúng chữ "de" của chỗ trống (câu có thể còn một chữ 的 khác đứng trước)
 const truoc=it.q.split(TRONG)[0].split("").filter(ch=>CHU.indexOf(ch)>=0).length;
 let dem=0;
 $("qPy").innerHTML=esc(it.p).replace(/ de /g,m=>dem++===truoc?" <u>de</u> ":m);
 $("qVn").textContent=it.v;
 const fb=$("fb");fb.className="fb";fb.textContent="";
 const nx=$("next");nx.className="g-row";nx.innerHTML="";
 const W=pond.clientWidth,H=pond.clientHeight,sm=W<430;
 pond.classList.toggle("sm",sm);
 g.tip=sm?{x:108,y:14}:{x:146,y:16};
 const rod=$("rod");rod.setAttribute("x1",sm?66:88);rod.setAttribute("y1",sm?68:90);
 rod.setAttribute("x2",g.tip.x);rod.setAttribute("y2",g.tip.y);
 $("fline").setAttribute("x1",g.tip.x);$("fline").setAttribute("y1",g.tip.y);
 g.fh=sm?50:62;
 const kinds=shuffle(FISHES),lanes=shuffle([0,1,2]);
 const top=WATER+34,gap=(H-top-g.fh-16)/2;
 g.fish=CHU.map((c,k)=>{
  const el=document.createElement("button");el.className="fish";el.type="button";
  const kind=kinds[k];el.style.height=g.fh+"px";
  el.setAttribute("aria-label","Chọn chữ "+c);
  // con cá kéo theo tấm biển chữ; đầu cá ở phía bơi tới
  el.innerHTML='<span class="flabel zh" lang="zh" style="font-size:'+(sm?27:34)+'px">'+c+'</span>'+
    '<img class="fimg" src="'+IMG[kind[0]]+'" alt="" draggable="false" width="'+Math.round(g.fh*kind[1])+'" height="'+g.fh+'">';
  pond.appendChild(el);const w=el.offsetWidth;
  const f={el:el,c:c,w:w,x:rnd(6,Math.max(8,W-w-6)),y:top+gap*lanes[k],dir:Math.random()<.5?-1:1,sp:rnd(22,40),ph:rnd(0,6.28),state:"swim"};
  el.onclick=()=>click(g,f);return f;});
}
function loop(g,ts){
 const pond=$("pond");if(G!==g||!pond)return;
 const dt=Math.min(.05,(ts-(g.last||ts))/1000);g.last=ts;g.t+=dt;
 const W=pond.clientWidth;let hook=null;
 g.fish.forEach(f=>{
  if(f.state==="swim"){
   f.x+=f.dir*f.sp*dt;
   if(f.x<4){f.x=4;f.dir=1;}
   if(f.x>W-f.w-4){f.x=W-f.w-4;f.dir=-1;}
  }else if(f.state==="pull"){
   f.k=Math.min(1,f.k+dt/.9);const e=1-Math.pow(1-f.k,3);
   f.x=f.x0+(f.tx-f.x0)*e;f.y=f.y0+(f.ty-f.y0)*e;
   if(f.k>=1){f.state="held";caught(g);}
  }
  const bob=f.state==="swim"?Math.sin(g.t*2+f.ph)*4:0;
  f.el.style.left=f.x+"px";f.el.style.top=(f.y+bob)+"px";
  f.el.classList.toggle("left",f.dir<0);
  if(f.state!=="swim")hook={x:f.x+(f.dir<0?8:f.w-8),y:f.y+g.fh/2};
 });
 const ln=$("fline"),b=$("bob");
 const ex=hook?hook.x:g.tip.x,ey=hook?hook.y:WATER+20+Math.sin(g.t*2.4)*3;
 ln.setAttribute("x2",ex);ln.setAttribute("y2",ey);
 b.setAttribute("cx",ex);b.setAttribute("cy",ey);b.style.display=hook?"none":"";
 requestAnimationFrame(t=>loop(g,t));
}
/* lời nhắc khi chọn sai: nói vì sao chữ vừa chọn không hợp với câu này */
function nhac(it,c){
 const s="«"+it.sau+"»",t="«"+it.truoc+"»";
 if(it.a==="的")return c==="得"
  ?"得 đứng sau động từ, phía sau nó là lời nhận xét (跑得很快). Ở đây sau chỗ trống là danh từ "+s+"."
  :"地 đứng trước động từ (高兴地笑). Ở đây sau chỗ trống là danh từ "+s+".";
 if(it.a==="得")return c==="的"
  ?"的 đứng trước danh từ (我的书). Ở đây "+s+" không phải danh từ mà là lời nhận xét cho động từ "+t+"."
  :"地 đứng trước động từ (高兴地笑). Ở đây động từ "+t+" lại đứng trước chỗ trống, còn "+s+" là lời nhận xét.";
 return c==="的"
  ?"的 đứng trước danh từ (我的书). Ở đây sau chỗ trống là động từ "+s+"."
  :"得 đứng sau động từ (跑得很快). Ở đây động từ "+s+" lại đứng sau chỗ trống, còn "+t+" tả cách làm.";
}
function click(g,f){
 if(g.busy||f.dead||f.state!=="swim")return;
 const fb=$("fb");
 if(f.c===g.cur.a){
  g.busy=true;sfx(true);
  f.state="pull";f.k=0;f.x0=f.x;f.y0=f.y;f.dir=-1;       // quay đầu về phía cần câu
  f.tx=g.tip.x-8;f.ty=WATER-18-g.fh/2;
  f.el.classList.add("got");
  g.fish.forEach(o=>{if(o!==f)o.el.disabled=true;});
 }else{
  f.dead=true;f.el.classList.add("no");f.el.disabled=true;sfx(false);
  g.miss++;
  fb.className="fb bad";fb.textContent="Chưa đúng. "+nhac(g.cur,f.c)+" Em chọn lại nhé!";thay(fb);
 }
}
function caught(g){
 const it=g.cur,ok=!g.miss;
 g.res.push(ok);if(ok)g.right++;
 const bl=$("blank");bl.textContent=it.a;bl.classList.add("fill");
 dots(g);
 const fb=$("fb");fb.className="fb ok";
 fb.textContent=(ok?pick(KHEN)+" ":"Đúng rồi. ")+it.vi;
 speak(full(it));
 const last=g.r>=g.items.length-1,nx=$("next");
 const b=btn("btn",last?"Xem kết quả":"Câu tiếp theo →",()=>{g.r++;if(last)done(g);else round(g);});
 nx.appendChild(b);nx.classList.add("on");
 try{b.focus({preventScroll:true});}catch(e){}
 thay(nx);
}
function done(g){
 G=null;window.scrollTo(0,0);
 const tot=g.items.length;
 let o={};try{o=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){}
 if(!o.total||g.right/tot>o.best/o.total){o.best=g.right;o.total=tot;}
 o.plays=(o.plays||0)+1;if(g.right===tot)o.done=1;
 try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}
 const sai=g.items.filter((_,k)=>!g.res[k]);
 const title=g.right===tot?"Tuyệt vời, em phân biệt được cả ba chữ rồi!":g.right>=tot*.8?"Em câu cá giỏi quá!":"Em câu thêm lần nữa nhé!";
 shell('<div class="card score"><div class="big">'+g.right+'<small>/'+tot+'</small></div>'+
  '<h2 class="g-end">'+title+'</h2><p class="g-lead">Em chọn đúng ngay lần đầu '+g.right+'/'+tot+' câu.</p>'+
  (sai.length?'<p class="xemlai-t">Những câu em còn vấp, đọc to lại một lần:</p><ul class="xemlai">'+sai.map(it=>
    '<li><span class="zh" lang="zh">'+esc(it.q).replace(TRONG,'<u>'+it.a+'</u>')+'</span><small class="py">'+esc(it.p)+'</small><small>'+esc(it.v)+'</small><small>'+esc(it.vi)+'</small></li>').join("")+'</ul>':'')+
  '<div class="g-row" id="ctrl"></div></div>');
 $("ctrl").appendChild(btn("btn","Chơi lại",start));
 $("ctrl").appendChild(btn("btn ghost","Xem lại mẹo",intro));
}

intro();
})();
